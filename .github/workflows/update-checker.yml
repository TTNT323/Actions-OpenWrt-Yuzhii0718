name: Update Checker

env:
  REPO_URL: https://github.com/Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly
  REPO_BRANCH: openwrt-24.10-6.6
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间中午 12:00       	0 12 * * *
    # 每周一北京时间中午 12:00      	0 12 * * 1
    # 每周日北京时间中午 12:00	      0 12 * * 0
    - cron: 0 12 * * 1

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Get latest upstream commit hash
        id: getHash
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH /tmp/upstream
          echo "commitHash=$(git -C /tmp/upstream rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compare with stored variable
        id: decide
        env:
          STORED: ${{ vars.LAST_COMMIT_HASH }}
        run: |
          NEW="${{ steps.getHash.outputs.commitHash }}"
          echo "stored = $STORED"
          echo "new    = $NEW"
          if [ "$STORED" = "$NEW" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ 代码无更新，跳过编译"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🚀 检测到代码更新"
          fi

      - name: Update repository variable
        if: steps.decide.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        run: |
          gh variable set LAST_COMMIT_HASH \
            --body "${{ steps.getHash.outputs.commitHash }}" \
            --repo ${{ github.repository }}

      - name: Trigger build
        if: steps.decide.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
          event-type: Source Code Update

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        with:
          retain_days: 1
          keep_minimum_runs: 1
